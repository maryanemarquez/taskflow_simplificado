spring:
  application:
    name: taskflow-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
taskflow:
  cors:
    origem: ${CORS_ORIGEM:http://localhost:8081}
